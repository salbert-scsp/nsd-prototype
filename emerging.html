/* ============ Emerging titles & skills: what O*NET has recorded before the classifications catch up ============ */

const RECENT = W.settings.recent_tasks_from, SRC_TASKS = "O*NET 31.0 Emerging Tasks";

const SRC_LABEL = { Incumbent: "workers in the job", "Occupational Expert": "occupational experts", "AI/SME": "AI-assisted, expert reviewed" };

/* ---------- the data: every emerging task, with its group and occupation ---------- */
const TASKS = W.emerging_tasks.map((t) => ({ soc: t[0], title: t[1], cat: t[2], text: t[3], when: t[4], year: +t[4].slice(0, 4), src: t[5], g: t[0].slice(0, 2) + "-0000", occ: OBY[t[0]] || null }));

const isRecent = (t) => t.year >= RECENT, aiMentions = (list) => list.filter((t) => AI_RE.test(t.text)).length, aiAssisted = (list) => list.filter((t) => t.src === "AI/SME").length;
/* The wave: the release month in which the most occupations got a drone or uncrewed-vehicle task. */
const waveByMonth = {};
TASKS.filter((t) => WAVE_RE.test(t.text)).forEach((t) => { (waveByMonth[t.when] = waveByMonth[t.when] || new Map()).set(t.soc + "|" + t.title, t); });
const WAVE_MONTH = Object.entries(waveByMonth).sort((a, b) => b[1].size - a[1].size)[0][0], WAVE = [...waveByMonth[WAVE_MONTH].values()];
const waveGroups = new Set(WAVE.map((t) => t.g)), isWave = (t) => t.when === WAVE_MONTH && WAVE_RE.test(t.text);
const unmatched = TASKS.filter((t) => !t.occ).length;
const tasksOf = (e) => { if (e.type === "all") return TASKS; if (e.type === "group") return TASKS.filter((t) => t.g === e.id); const codes = new Set(e.members.map((o) => o.soc)); return TASKS.filter((t) => codes.has(t.soc)); };
/* the share of a set of occupations with at least one new task since 2024 */

/* ---------- sentences, filled from the data; they describe what O*NET recorded, nothing more ---------- */
const aiLine = (all, whole) => { const m = aiMentions(all), a = aiAssisted(all), of = whole ? `the ${all.length}` : all.length === 1 ? "its" : `its ${all.length}`; return `${m === 0 ? "None" : "Only " + m} of ${of} ${all.length === 1 && !whole ? "task" : "tasks"} ${m === 0 ? "describes" : "mention"} AI${m === 0 ? " work" : ""}${a ? `; ${a} ${a === 1 ? "was" : "were"} identified with AI assistance and reviewed by experts` : ""}.`; };
function leadSentence(e) {
  const all = tasksOf(e), rec = all.filter(isRecent);
  if (e.type === "all") return `O*NET has recorded ${fmt.format(all.length)} emerging tasks, ${fmt.format(rec.length)} of them since ${RECENT}.`;
  if (e.type === "occ") return all.length === 0 ? `O*NET has recorded no emerging tasks for ${esc(lcAll(e.o.t))}.` : `O*NET has recorded ${plural(all.length, "emerging task")} for ${esc(lcAll(e.o.t))}${rec.length === all.length ? "" : `, ${rec.length} of them since ${RECENT}`}.`;
  const nm = e.type === "group" ? short(e.g) : e.name;
  return rec.length === 0 ? `${esc(nm)} has no emerging task since ${RECENT}.` : `${esc(nm)} has ${plural(rec.length, "emerging task")} since ${RECENT}, ${Math.round(rec.length / TASKS.filter(isRecent).length * 100)}% of the ${fmt.format(TASKS.filter(isRecent).length)} recorded.`;
}
function subLine(e) {
  const all = tasksOf(e), rec = all.filter(isRecent), w = all.filter(isWave);
  if (e.type === "all") return `In ${monthName(WAVE_MONTH)} it added drone and uncrewed-vehicle tasks to ${WAVE.length} occupations in ${waveGroups.size} groups at once.`;
  if (e.type === "occ") {
    if (!all.length) return "That can mean it has not been re-surveyed yet, not that nothing changed.";

    return `The latest is dated ${monthName(last.when)}.${w.length ? ` It is one of the ${WAVE.length} occupations that got a drone or uncrewed-vehicle task in ${monthName(WAVE_MONTH)}.` : ""}`;
  }

function methodNote() {
  return `<strong>What this counts.</strong> O*NET’s Emerging Tasks file lists tasks found in occupations that are not yet in its task lists. Counts reflect O*NET’s rolling update schedule, not the amount of change: O*NET re-surveys each occupation every few years, so an occupation with no new task may simply not have been re-surveyed yet. Tasks are not jobs, and a task recorded is not a measure of how many workers do it. ${unmatched} of the ${TASKS.length} tasks sit in O*NET occupations that OEWS combines with others; they count in group totals but not in occupation lists. These are the tasks O*NET has recorded; new job titles in postings arrive with NLx data.`;
}

/* ---------- the rank list: groups by the share of their occupations with a new task since 2024 ---------- */
const ORDER = GROUPS.slice().sort((a, b) => (GSTAT[b.code].share - GSTAT[a.code].share) || (GSTAT[b.code].n - GSTAT[a.code].n) || short(a).localeCompare(short(b)));
const rankRows = () => ORDER.map((g) => { const s = GSTAT[g.code]; return { code: g.code, name: short(g), val: Math.round(s.share * 100) + "%", label: `${Math.round(s.share * 100)} percent of occupations have a new task since ${RECENT}`, bar: { mode: "lin", v: s.share * 100, max: 100 }, bench: ALL_TOUCHED / OCC.length * 100, sub: `${plural(s.n, "task")} · ${s.k} of ${s.m} occupations` }; });
$("rank-note").textContent = `Share of each group’s occupations with at least one new O*NET task since ${RECENT}; the line under each group is the task count. The dark tick marks all occupations, ${Math.round(ALL_TOUCHED / OCC.length * 100)}%. Counts reflect O*NET’s rolling update schedule (it re-surveys each occupation every few years), not the amount of change. Source: ${SRC_TASKS}; BLS OEWS occupations.`;

/* ---------- the chart: tasks recorded each year, the selection against everything else ---------- */
function drawYears(Wd) {

  const e = current, box = $("chart"); box.innerHTML = "";
  const mine = new Set(tasksOf(e)), years = [], y0 = Math.min(...TASKS.map((t) => t.year)), y1 = Math.max(...TASKS.map((t) => t.year));

      parts.forEach(([base, n]) => {

  const anchorEnd = wx > Wd * 0.6;
  svgEl("line", { x1: wx, x2: wx, y1: wTop - 4, y2: T - 14, stroke: css("--ink-2"), "stroke-width": 1 }, s);
  txt(s, anchorEnd ? wx - 6 : wx + 6, T - 18, wl, { "text-anchor": anchorEnd ? "end" : "start", class: "lab", style: `paint-order:stroke;stroke:${css("--surface")};stroke-width:4px` });
  const my = (T + H - Bm) / 2; txt(s, 14, my, "Tasks recorded per year", { "text-anchor": "middle", class: "lab2", transform: `rotate(-90 14 ${my})` });
}

/* ---------- sections: closed, each ending in one plain source line ---------- */
const secTasks = addSection("Emerging tasks", ""), secWave = addSection("The drone wave of May 2025", ""), secOccs = addSection("Occupations with emerging tasks", "");
secTasks.body.innerHTML = `<div class="filters"><div><label for="src-f">Identified by</label><select id="src-f" class="sel-select"><option value="">Everyone</option><option value="Incumbent">Workers in the job</option><option value="Occupational Expert">Occupational experts</option><option value="AI/SME">AI-assisted, expert reviewed</option></select></div><div class="count-note" id="task-count"></div></div><div id="task-list"></div>`;
function paintTasks() {
  if (!current) return;
  const f = $("src-f").value, all = tasksOf(current).filter((t) => !f || t.src === f).sort((a, b) => (a.when < b.when ? 1 : a.when > b.when ? -1 : a.soc.localeCompare(b.soc)));
  $("task-count").textContent = `${plural(all.length, "task")}`;
  $("task-list").innerHTML = (all.length ? `<div class="tasklist" tabindex="0" role="region" aria-label="Emerging tasks list">${all.map((t) => `<div class="task"><div class="task__d">${t.when}</div><div>${esc(t.text)}<div class="task__o">${esc(t.title)} · ${t.soc} · ${t.cat === "Revision" ? "revised task" : "new task"} · ${SRC_LABEL[t.src] || esc(t.src)}${isWave(t) ? " · drone wave" : ""}</div></div></div>`).join("")}</div>`
    : `<p>No emerging tasks for this selection${f ? " from this source" : ""}. That can mean O*NET has not re-surveyed these occupations yet, not that nothing changed.</p>`) + srcLine(`${SRC_TASKS}. O*NET re-surveys each occupation every few years.`);
}
$("src-f").addEventListener("change", paintTasks);
function paintWave(e) {
  const cnt = {}; WAVE.forEach((t) => { cnt[t.g] = (cnt[t.g] || 0) + 1; });
  const rows = Object.entries(cnt).sort((a, b) => b[1] - a[1]), max = rows[0][1], mineW = WAVE.filter((t) => tasksOf(e).includes(t)), parent = e.type === "occ" ? e.o.g : e.type === "group" ? e.id : null;
  secWave.setSummary(`${WAVE.length} occupations in ${waveGroups.size} groups`);
  secWave.body.innerHTML = `<p>In ${monthName(WAVE_MONTH)} O*NET added a drone or uncrewed-vehicle task to ${WAVE.length} occupations in one release, in ${waveGroups.size} of the 22 groups. It is the clearest case in the file of one technology reaching many kinds of work at once.</p>
    <div class="bars" id="wave-bars" role="group" aria-label="Occupations in the drone wave, by group">${rows.map(([g, n]) => `<div class="bar${g === parent ? " bar--sel" : ""}"${tipData(short(GBY[g]), `${n} of ${WAVE.length} occupations in the ${monthName(WAVE_MONTH)} drone wave`, "Source: " + SRC_TASKS)}><span>${esc(short(GBY[g]))}</span><div class="bar__track"><div class="bar__fill" style="width:${n / max * 100}%"></div></div><span class="bar__v">${n}</span></div>`).join("")}</div>
    ${e.type === "all" ? "" : `<p>${mineW.length ? `In this selection: ${mineW.map((t) => esc(t.title)).join("; ")}.` : "No occupation in this selection was in the drone wave."}</p>`}${srcLine(`${SRC_TASKS}, tasks dated ${WAVE_MONTH} that mention drones or uncrewed vehicles.`)}`;
  kbChart($("wave-bars"), "Drone wave occupations by group");
}
secOccs.body.innerHTML = `<div id="occ-tbl"></div>`;
const tcount = (o, f) => TASKS.filter((t) => t.soc === o.soc && (!f || f(t))).length, tlast = (o) => TASKS.filter((t) => t.soc === o.soc).reduce((m, t) => (t.when > m ? t.when : m), "");
tablePaint = dataTable($("occ-tbl"), {
  label: "Occupations with emerging tasks", sort: "recent", rows: () => tableOccs,
  cols: [{ k: "name", label: "Occupation", val: (o) => o.t.toLowerCase(), html: (o) => `<button type="button" class="linkish" data-pick="${o.soc}">${esc(o.t)}</button><div class="soc">${o.soc}</div>` },
    { k: "recent", label: `Tasks since ${RECENT}`, num: true, val: (o) => tcount(o, isRecent), html: (o) => tcount(o, isRecent) },
    { k: "all", label: "Tasks, all years", num: true, val: (o) => tcount(o), html: (o) => tcount(o) },
    { k: "last", label: "Latest", num: true, val: (o) => tlast(o), html: (o) => tlast(o) },
    { k: "jobs", label: "Jobs, 2025", num: true, val: (o) => o.emp[3], html: (o) => fmt.format(o.emp[3]) }],
  note: () => srcLine(`${SRC_TASKS}; BLS OEWS, May 2025. Only occupations with at least one task are listed. Counts reflect O*NET’s rolling update schedule, not the amount of change.`),
});
$("occ-tbl").addEventListener("click", (ev) => { if (ev.target.closest("[data-pick]")) window.scrollTo({ top: 0, behavior: "smooth" }); });

/* ---------- coming with new data: new job titles and skill combinations, from job postings (NLx). Invented, to show the layout. ---------- */
const SAMPLE_TITLES = [["AI evaluation specialist", 4100, [3, 4, 6, 9, 13, 18], "15-1299 Computer occupations, all other", "new"], ["Heat pump installer", 6800, [8, 9, 11, 12, 15, 17], "49-9021 HVAC mechanics and installers", "watch"], ["Revenue operations analyst", 5200, [10, 11, 12, 14, 15, 16], "13-1111 Management analysts", "watch"], ["Clinical AI scribe coordinator", 900, [1, 1, 2, 4, 6, 9], "29-2072 Medical records specialists", "new"], ["Drone inspection pilot", 2300, [7, 8, 8, 9, 10, 10], "53-2012 Commercial pilots", "known"], ["Battery cell technician", 1700, [4, 5, 6, 8, 9, 11], "51-2028 Electrical assemblers", "watch"]];
const SAMPLE_PAIRS = [["Nursing + data analytics", 2.4], ["Accounting + Python", 1.9], ["Graphic design + motion/3D", 1.6], ["Customer service + CRM automation", 1.5], ["Electrical + battery storage", 1.3]];
const PILL = { new: ["pill--new", "Emerging"], watch: ["pill--watch", "Watch"], known: ["pill--known", "Now in O*NET"] };
const spark = (vals, name) => { const w = 90, h = 24, mx = Math.max(...vals), mn = Math.min(...vals), pts = vals.map((v, i) => [2 + i * (w - 6) / (vals.length - 1), h - 3 - (v - mn) / ((mx - mn) || 1) * (h - 6)]), l = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"${tipData(name, `Postings, last ${vals.length} months: ${vals.join(" → ")} (invented)`, "SAMPLE: invented to show the layout; needs NLx job postings")}><path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ")}"/><circle cx="${l[0]}" cy="${l[1]}" r="2.5"/></svg>`; };
const coming = addComing("New job titles and skill combinations from job postings; needs NLx data");
coming.body.innerHTML = `<h3>New job titles in postings</h3><p>Posting titles grouped by meaning, then flagged when a group matches no O*NET title and keeps growing across many employers. The rows below are invented to show the layout, not measured.</p>
  <div class="tbl" tabindex="0" role="region" aria-label="Sample table of new job titles"><table><thead><tr><th>Title group</th><th class="n">Postings, 12 months</th><th>Trend</th><th>Closest official occupation</th><th>Status</th></tr></thead><tbody>${SAMPLE_TITLES.map(([t, n, sp, soc, st]) => `<tr><td><b>${esc(t)}</b></td><td class="n">${fmt.format(n)}</td><td>${spark(sp, t)}</td><td>${esc(soc)}</td><td><span class="pill ${PILL[st][0]}">${PILL[st][1]}</span></td></tr>`).join("")}</tbody></table></div>
  <p class="note">Rule to test: no match to O*NET job titles, 3+ months of growth, 25+ employers, 3+ states. Runs on SCSP machines only; raw postings never go to an AI service.</p>
  <h3>New skill combinations</h3><p>Skill pairs from different fields that appear together more often than last year. Invented pairs, shown for layout.</p>
  <div class="bars" id="pair-bars" role="group" aria-label="Sample skill pairs">${SAMPLE_PAIRS.map(([p, v]) => `<div class="bar"${tipData(p, `Change in lift ×${v.toFixed(1)} since last year (invented)`, "SAMPLE: invented to show the layout; needs NLx job postings")}><span>${esc(p)}</span><div class="bar__track"><div class="bar__fill" style="width:${v / 2.6 * 100}%"></div></div><span class="bar__v">×${v.toFixed(1)}</span></div>`).join("")}</div>
  <p class="note">Measure: change in lift (how much more often two skills appear together than chance) year over year.</p>`;
kbChart($("pair-bars"), "Sample skill pairs"); kbChart(coming.body.querySelector(".tbl"), "Sample trend lines");

/* ---------- readout and render ---------- */
function readout(e) {
  const box = $("readout");
  if (e.type !== "occ") { box.innerHTML = ""; return; }   // nothing to pick on this page, so no hint
  const all = tasksOf(e).sort((a, b) => (a.when < b.when ? 1 : -1));
  box.innerHTML = `<div class="readout__h"><b>${esc(e.o.t)}</b><span class="soc">${e.o.soc} · ${esc(short(e.o.grp))}</span></div>` + (all.length ? `<div class="tasklist" style="max-height:none;border-top:0">${all.slice(0, 4).map((t) => `<div class="task"><div class="task__d">${t.when}</div><div>${esc(t.text)}<div class="task__o">${t.cat === "Revision" ? "revised task" : "new task"} · ${SRC_LABEL[t.src] || esc(t.src)}</div></div></div>`).join("")}</div>${all.length > 4 ? `<p class="note">${all.length - 4} more in the list below.</p>` : ""}` : `<p class="note">No emerging task is recorded for this occupation.</p>`);
}
function render(e) {
  const first = !current; current = e;
  $("headline").innerHTML = leadSentence(e); $("subline").innerHTML = subLine(e); $("context").innerHTML = contextLine(e); $("method").innerHTML = methodNote();
  renderRank(rankRows(), e); readout(e);
  const all = tasksOf(e), listing = listOf(e);
  $("chart-note").textContent = `${e.type === "all" ? "" : "Highlighted: " + (e.type === "occ" ? e.name : e.short) + ". "}Each bar is the emerging tasks O*NET recorded that year; the striped part of the ${monthName(WAVE_MONTH).split(" ")[1]} bar, more than half of it, is one batch update, when O*NET added drone tasks to ${WAVE.length} occupations at once, not a trend. The last year is partial. Source: ${SRC_TASKS}.`;
  secTasks.setSummary(`${plural(all.length, "task")}`);
  tableOccs = listing.filter((o) => TASKS.some((t) => t.soc === o.soc)); secOccs.setSummary(`${tableOccs.length} of ${listing.length} occupations`); tablePaint();
  paintTasks(); paintWave(e); redraw();
  if (!first) fadeIn(["headline", "plate"]);
}
redraw = responsive($("chart"), drawYears);
kbChart($("chart"), "Emerging tasks recorded each year");
const repaint = () => { if (current) redraw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint);
startPage(render);
</script>
</body></html>
